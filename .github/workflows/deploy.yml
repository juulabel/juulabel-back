name: Deploy to Development and Production

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build with Gradle
        run: ./gradlew bootJar

      # 개발용 Docker 이미지 Build & Push
      - name: Docker Build & Push for Development
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_REPO }}/juulabel_dev_backend .  # 개발 서버용 이미지
          docker push ${{ secrets.DOCKER_REPO }}/juulabel_dev_backend
        if: github.ref != 'refs/heads/main'  # main 브랜치를 제외한 모든 브랜치에서 실행

      # 운영용 Docker 이미지 Build & Push
      - name: Docker Build & Push for Production
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_REPO }}/juulabel_backend .  # 운영 서버용 이미지
          docker push ${{ secrets.DOCKER_REPO }}/juulabel_backend
        if: github.ref == 'refs/heads/main'  # main 브랜치에서만 실행

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up application.yml for Development
        run: |
          mkdir -p ./src/main/resources
          cd ./src/main/resources
          touch ./application.yml
          echo "${{ secrets.APPLICATION_DEV }}" >> ./application.yml
        shell: bash
        if: github.ref != 'refs/heads/main'  # main 브랜치를 제외한 모든 브랜치에서 실행

      - name: Set up application.yml for Production
        run: |
          mkdir -p ./src/main/resources
          cd ./src/main/resources
          touch ./application.yml
          echo "${{ secrets.APPLICATION_PROD }}" >> ./application.yml
        shell: bash
        if: github.ref == 'refs/heads/main'  # main 브랜치에서만 실행

      - name: Deploy to Development Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ubuntu
          key: ${{ secrets.KEY_DEV }}
          port: 22
          script: |
            sudo docker pull ${{ secrets.DOCKER_REPO }}/juulabel_backend
            sudo docker compose down
            sudo docker compose up -d
        if: github.ref != 'refs/heads/main'  # main 브랜치를 제외한 모든 브랜치에서 실행

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.KEY_PROD }}
          port: 22
          script: |
            sudo docker pull ${{ secrets.DOCKER_REPO }}/juulabel_backend
            sudo docker compose down
            sudo docker compose up -d
        if: github.ref == 'refs/heads/main'  # main 브랜치에서만 실행
